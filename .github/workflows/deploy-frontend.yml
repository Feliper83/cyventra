name: Deploy Frontend

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/server/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or commit SHA) — used for rollback'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run client:build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::524522256526:role/github-actions-cyventra-deploy
          aws-region: us-east-1

      - name: Upload static assets (long cache)
        run: |
          aws s3 sync dist/ s3://cyventra-frontend-prod \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "*.html" \
            --exclude "*.json"

      - name: Upload HTML/JSON (no cache, for SPA routing)
        run: |
          aws s3 sync dist/ s3://cyventra-frontend-prod \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1H4D0CNWQ86P6 \
            --paths "/*"
