name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'src/server/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or commit SHA) — used for rollback'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify DATABASE_URL secret is present
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret is empty or missing. Refusing to deploy — this would overwrite the live Lambda's environment.DATABASE_URL and break production DB connectivity."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/server/package-lock.json

      - name: Install backend dependencies
        working-directory: src/server
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::524522256526:role/github-actions-cyventra-deploy
          aws-region: us-east-1

      - name: Deploy with Serverless Framework
        working-directory: src/server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: npx serverless deploy --stage prod --verbose
